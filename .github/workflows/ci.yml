name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# go.mod's go line is the oldest version tested. GOTOOLCHAIN=local makes a
# job fail rather than silently download a newer toolchain, so each job runs
# the Go version its name says.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24', 'stable']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run tests (with coverage)
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
